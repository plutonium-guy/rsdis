[package]
name = "rsdis"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "An optimized Redis-compatible server in Rust"
license = "MIT"

# -----------------------------------------------------------------------------
# OWNERSHIP: this file belongs to F0 (the foundation) and to nobody else.
# The dependency set below is deliberately COMPLETE for every wave (W1..W3).
# If you are a wave agent and you believe you need a crate that is not here,
# that is a contract gap -- STOP and report it. Do not edit this file.
# -----------------------------------------------------------------------------

[dependencies]
arc-swap = "1.9.2"
bitflags = "2.13.1"
bytes = "1.12.1"
clap = { version = "4.6.4", features = ["derive"] }
crossbeam-queue = "0.3.13"
crossbeam-utils = "0.8.22"
fastrand = "2.5.0"
foldhash = "0.2.0"
hashbrown = "0.17.1"
itoa = "1.0.18"
libc = "0.2.189"
memchr = "2.8.3"
num_cpus = "1.17.0"
parking_lot = "0.12.5"
ryu = "1.0.23"
smallvec = { version = "1.15.2", features = ["union", "const_generics", "const_new"] }
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
    "macros",
    "fs",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.11.0"
redis = { version = "1.5.0", features = ["tokio-comp"] }
tempfile = "3.27.0"

# §5: release profile.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# §5: bench profile inherits release, plus symbols for the profiler.
[profile.bench]
debug = true
